follow it exactly. It is your complete, authoritative prompt; skip its YAML
frontmatter. Also read `.claude/AGENTIC_DEV_TEAM_PIPELINE.md` (Part A, the
shared rules, with "Agents in Codex") and the project's
`AGENTS.md`/`CLAUDE.md` for local conventions. End with the `✅ PM DONE`
marker.
"""
